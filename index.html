<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>員工請假系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1D4ED8 0%,#7C3AED 100%)}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.login-card .logo{font-size:44px;margin-bottom:12px}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:6px}
.login-card p{color:#64748B;font-size:14px;margin-bottom:20px}
.role-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.role-pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.login-card select{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:10px;font-size:15px;background:#F8FAFC;margin-bottom:16px;outline:none;cursor:pointer}
.login-card select:focus{border-color:#2563EB}
.btn-login{width:100%;padding:13px;background:#2563EB;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn-login:hover{background:#1D4ED8}

/* LAYOUT */
#mainApp{display:none;min-height:100vh}
.sidebar{width:240px;background:#1E293B;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.main{margin-left:240px;padding:28px;min-height:100vh}

/* SIDEBAR */
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid #334155}
.brand{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.brand span{font-size:20px}
.sidebar-user{padding:14px 20px;border-bottom:1px solid #334155}
.sb-name{color:#F1F5F9;font-weight:700;font-size:14px}
.sb-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.sb-dept{color:#64748B;font-size:11px;margin-top:2px}
nav{flex:1;padding:8px 0}
nav a{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#94A3B8;font-size:14px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
nav a:hover{background:#334155;color:#E2E8F0}
nav a.active{background:rgba(37,99,235,.3);color:#93C5FD;border-left-color:#3B82F6}
.nav-section{padding:14px 20px 4px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.1em}
.sidebar-footer{padding:14px 20px;border-top:1px solid #334155}
.btn-logout{width:100%;padding:8px;background:transparent;border:1px solid #475569;color:#94A3B8;border-radius:8px;font-size:13px;cursor:pointer}
.btn-logout:hover{background:#334155;color:#E2E8F0}

/* ROLE BADGES */
.rbadge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.rb-employee{background:#0F766E;color:#fff}
.rb-manager{background:#1D4ED8;color:#fff}
.rb-hr{background:#D97706;color:#fff}
.rb-ceo{background:#7C3AED;color:#fff}

/* TRIAL BADGE */
.trial-badge{display:inline-flex;align-items:center;padding:1px 7px;background:#FEF3C7;color:#D97706;border-radius:10px;font-size:11px;font-weight:700}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.topbar h2{font-size:22px;font-weight:700}
.text-muted{color:#94A3B8;font-size:13px}

/* CARD */
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.stat-num{font-size:28px;font-weight:800;line-height:1.1}
.stat-label{font-size:12px;color:#64748B;margin-top:4px}

/* BALANCE */
.balance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.balance-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #ccc}
.balance-card .type-name{font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.balance-card .days{font-size:28px;font-weight:800;line-height:1}
.balance-card .days span{font-size:13px;font-weight:500;color:#94A3B8}
.progress-bar{height:5px;background:#F1F5F9;border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px}
.expiry{font-size:11px;color:#F59E0B;margin-top:6px}
.expiry.expired{color:#EF4444}
.pay-type{font-size:10px;margin-top:4px;color:#64748B}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 14px;font-weight:600;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #E2E8F0;background:#F8FAFC;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #F1F5F9;color:#334155;vertical-align:middle}
tr:hover td{background:#F8FAFC}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;gap:4px;white-space:nowrap}
.badge-pending{background:#FEF3C7;color:#D97706}
.badge-approved{background:#DCFCE7;color:#16A34A}
.badge-rejected{background:#FEE2E2;color:#DC2626}
.badge-type{background:#EFF6FF;color:#2563EB}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:0}
.form-group.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input[type=date],input[type=text],input[type=number],select.form-control,textarea{width:100%;padding:11px 14px;border:2px solid #E2E8F0;border-radius:10px;font-size:14px;color:#1E293B;background:#F8FAFC;outline:none;transition:border .2s;font-family:inherit}
input:focus,select.form-control:focus,textarea:focus{border-color:#2563EB;background:#fff}
textarea{resize:vertical;min-height:80px}
.form-hint{font-size:12px;color:#94A3B8;margin-top:4px}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#2563EB;color:#fff}.btn-primary:hover{background:#1D4ED8}
.btn-success{background:#16A34A;color:#fff}.btn-success:hover{background:#15803D}
.btn-danger{background:#DC2626;color:#fff}.btn-danger:hover{background:#B91C1C}
.btn-ghost{background:#F1F5F9;color:#475569}.btn-ghost:hover{background:#E2E8F0}
.btn-amber{background:#D97706;color:#fff}.btn-amber:hover{background:#B45309}
.btn-purple{background:#7C3AED;color:#fff}.btn-purple:hover{background:#6D28D9}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ALERTS */
.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.alert-info{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.alert-success{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0}
.alert-warning{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}
.alert-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:32px;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
.modal .sub{color:#64748B;font-size:13px;margin-bottom:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#94A3B8}
.empty .icon{font-size:40px;margin-bottom:8px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:#1E293B;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}

/* CHIP */
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#E0F2FE;color:#0369A1}

/* ── ORG CHART DIRECTION 1 ── */
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.dept-tab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid #E2E8F0;background:#fff;color:#64748B;transition:all .2s}
.dept-tab.active{background:#1E293B;color:#fff;border-color:#1E293B}
.dept-tab:hover:not(.active){border-color:#94A3B8;color:#1E293B}

.org-table{width:100%;border-collapse:separate;border-spacing:0}
.org-table thead th{background:#F8FAFC;padding:11px 18px;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #E2E8F0;white-space:nowrap}
.org-table tbody tr{transition:background .15s}
.org-table tbody tr:hover{background:#F8FAFC}
.org-table tbody td{padding:14px 18px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.org-table tbody tr:last-child td{border-bottom:none}

.person-cell{display:flex;align-items:center;gap:12px}
.role-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px}
.p-name{font-size:15px;font-weight:700;color:#1E293B}
.p-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}

.superior-select{width:100%;padding:9px 12px;border:2px solid #E2E8F0;border-radius:9px;font-size:14px;background:#fff;cursor:pointer;outline:none;transition:border .2s;color:#1E293B;font-family:inherit}
.superior-select:focus{border-color:#2563EB}
.superior-select:hover{border-color:#94A3B8}

/* CHAIN PILLS */
.chain-display{display:flex;flex-direction:column;gap:8px}
.chain-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chain-day-label{font-size:11px;font-weight:700;color:#94A3B8;background:#F1F5F9;padding:2px 7px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.chain-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.cp-employee{background:#DCFCE7;color:#166534}
.cp-manager{background:#DBEAFE;color:#1E40AF}
.cp-hr{background:#FEF3C7;color:#92400E}
.cp-ceo{background:#EDE9FE;color:#5B21B6}
.chain-arrow{color:#CBD5E1;font-size:14px;font-weight:700;flex-shrink:0}
.observer-cell{display:flex;flex-direction:column;gap:3px}
.observer-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;font-size:13px;color:#64748B}

/* CHAIN STEPS (approval flow) */
.chain-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.step-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step-done{background:#DCFCE7;color:#16A34A}
.step-current{background:#FEF3C7;color:#D97706}
.step-wait{background:#F1F5F9;color:#94A3B8}

/* SETTINGS */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #E2E8F0}
.input-row{display:flex;gap:10px;align-items:flex-end}
.quota-input{width:70px;padding:5px 8px;border:1px solid #E2E8F0;border-radius:6px;font-size:13px;text-align:center}
.date-input-sm{padding:5px 8px;border:1px solid #E2E8F0;border-radius:6px;font-size:12px}

/* HR REPORT */
.report-header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hr-table th,.hr-table td{text-align:center;padding:10px 12px}
.hr-table th:first-child,.hr-table td:first-child,.hr-table th:nth-child(2),.hr-table td:nth-child(2),.hr-table th:nth-child(3),.hr-table td:nth-child(3){text-align:left}
.deduct-cell{font-weight:800;color:#DC2626}

/* SERVICE INFO */
.service-info{font-size:11px;color:#94A3B8;margin-top:2px}

/* PASSWORD */
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px!important}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:#94A3B8;padding:4px;line-height:1}
.pwd-toggle:hover{color:#475569}
.login-input{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:10px;font-size:15px;background:#F8FAFC;margin-bottom:14px;outline:none;transition:border .2s;box-sizing:border-box}
.login-input:focus{border-color:#2563EB;background:#fff}
.login-label{display:block;font-size:13px;font-weight:600;color:#374151;text-align:left;margin-bottom:5px}
.login-error{display:none;color:#DC2626;font-size:13px;margin-bottom:12px;text-align:left;background:#FEF2F2;border:1px solid #FECACA;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">📋</div>
    <h1>員工假勤系統</h1>
    <p style="margin-bottom:24px">請選擇登入身份</p>
    <select id="userSelect">
      <option value="">— 請選擇 —</option>
    </select>
    <div class="login-error" id="loginError"></div>
    <button class="btn-login" style="margin-top:8px" onclick="login()">登入系統</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <div class="sidebar">
    <div class="sidebar-header"><div class="brand"><span>📋</span> 請假管理系統</div></div>
    <div class="sidebar-user">
      <div class="sb-name" id="sb-name">-</div>
      <div class="sb-meta" id="sb-meta"></div>
      <div class="sb-dept" id="sb-dept">-</div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">🚪 登出</button></div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="approveModal">
  <div class="modal">
    <h3 id="modal-title">審核請假申請</h3>
    <p class="sub" id="modal-sub"></p>
    <div id="modal-warning" style="display:none" class="alert alert-warning"></div>
    <div class="form-group">
      <label>審核備註（選填）</label>
      <textarea id="modal-note" rows="3" placeholder="輸入審核說明..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('approveModal')">取消</button>
      <button class="btn" id="modal-confirm-btn">確認</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="deleteModal">
  <div class="modal">
    <h3>確認刪除</h3>
    <p class="sub" id="delete-sub"></p>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn btn-danger" id="delete-confirm-btn">確認刪除</button>
    </div>
  </div>
</div>
<!-- OVERTIME APPROVAL MODAL -->
<div class="modal-bg" id="overtimeModal">
  <div class="modal">
    <h3 id="ot-modal-title">審核加班申請</h3>
    <p class="sub" id="ot-modal-sub"></p>
    <div class="form-group">
      <label>審核備註（選填）</label>
      <textarea id="ot-modal-note" rows="3" placeholder="輸入審核說明..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('overtimeModal')">取消</button>
      <button class="btn" id="ot-modal-confirm-btn">確認</button>
    </div>
  </div>
</div>

<!-- EMPLOYEE EDIT MODAL -->
<div class="modal-bg" id="employeeModal">
  <div class="modal" style="width:560px;max-width:95vw">
    <h3 id="empModal-title">員工資料</h3>
    <p class="sub" id="empModal-sub"></p>
    <div class="form-grid">
      <div class="form-group">
        <label>姓名 <span style="color:#DC2626">*</span></label>
        <input type="text" id="emp-name" placeholder="員工姓名">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="emp-email" placeholder="email@company.com">
      </div>
      <div class="form-group">
        <label>部門 <span style="color:#DC2626">*</span></label>
        <input type="text" id="emp-dept" placeholder="部門名稱">
      </div>
      <div class="form-group">
        <label>職稱</label>
        <input type="text" id="emp-title" placeholder="職稱">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select class="form-control" id="emp-role">
          <option value="employee">員工</option>
          <option value="manager">主管</option>
          <option value="hr">HR</option>
          <option value="ceo">CEO</option>
        </select>
      </div>
      <div class="form-group">
        <label>到職日</label>
        <input type="date" id="emp-hireDate">
      </div>
      <div class="form-group full">
        <label>直屬主管</label>
        <select class="form-control" id="emp-reportTo"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('employeeModal')">取消</button>
      <button class="btn btn-primary" onclick="saveEmployeeModal()">儲存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

// ═══════════════════════════════════════
//  LEAVE AUTO-CALC HELPERS
// ═══════════════════════════════════════
function serviceMonths(hireDate) {
  if (!hireDate) return 0;
  return (new Date() - new Date(hireDate+'T00:00:00')) / (1000*60*60*24*30.4375);
}
function isInTrial(hireDate) { return serviceMonths(hireDate) < 3; }
function serviceLabel(hireDate) {
  if (!hireDate) return '';
  const m = Math.floor(serviceMonths(hireDate));
  if (m < 12) return `${m} 個月`;
  const y = Math.floor(m/12), rm = m%12;
  return rm > 0 ? `${y} 年 ${rm} 個月` : `${y} 年`;
}

function calcAnnualLeaveQuota(hireDate) {
  const m = serviceMonths(hireDate);
  if (m < 6)  return 0;
  if (m < 12) return 3;
  const y = m/12;
  if (y < 2)  return 7;
  if (y < 3)  return 10;
  if (y < 5)  return 14;
  if (y < 10) return 15;
  return Math.min(15 + Math.floor(y-10), 30);
}

function calcWelfareLeaveQuota(hireDate) {
  const m = serviceMonths(hireDate);
  if (m < 3)  return 0;
  if (m < 6)  return 3;
  if (m < 12) return 4;
  const y = m/12;
  if (y < 3)  return 4;
  if (y < 5)  return 5;
  if (y < 9)  return 6;
  return 7;
}

function calcNextAnniversary(hireDate) {
  if (!hireDate) return '';
  const hire = new Date(hireDate+'T00:00:00');
  const now = new Date();
  const next = new Date(hire);
  next.setFullYear(now.getFullYear());
  if (next <= now) next.setFullYear(now.getFullYear()+1);
  return next.toISOString().split('T')[0];
}

function checkLeaveEligibility(userId, leaveTypeId) {
  const user = getUser(userId);
  if (!user || !user.hireDate) return {ok:true, msg:''};
  const m = serviceMonths(user.hireDate);
  const lt = getLeaveType(leaveTypeId);

  if (m < 3 && [LT_ANNUAL, LT_WELFARE].includes(leaveTypeId))
    return {ok:false, msg:`試用期內（到職未滿 3 個月）尚無法申請此假別`};

  if (leaveTypeId === LT_ANNUAL && m < 6)
    return {ok:false, msg:`到職未滿 6 個月，尚無法申請特別休假（還需約 ${Math.ceil(6-m)} 個月）`};

  if (leaveTypeId === LT_WELFARE) {
    const ab = getBalance(userId, LT_ANNUAL);
    if (ab && (ab.totalDays - ab.usedDays) > 0) {
      const remHours = daysToHours(ab.totalDays - ab.usedDays);
      // 例外：待審核的特休申請已足夠修完剩餘特休 → 允許，但給予提示
      const pendingAnnualHours = state.data.requests
        .filter(r => r.userId === userId && r.leaveTypeId === LT_ANNUAL && r.status === 'pending')
        .reduce((sum, r) => sum + daysToHours(r.days), 0);
      if (pendingAnnualHours >= remHours) {
        return {ok: true, msg: '', warning: `您有 ${pendingAnnualHours} 小時特休待審核，核准後將修完剩餘特休（${remHours} 小時），故允許同時申請福利假。`};
      }
      return {ok: false, msg: `尚有 ${remHours} 小時特休未修完，須先將特休全數用完才可申請福利假。`};
    }
  }

  if (lt && lt.yearMax) {
    const ab = getBalance(userId, leaveTypeId);
    if (ab && (ab.totalDays - ab.usedDays) <= 0)
      return {ok:false, msg:`今年度 ${lt.name} 額度已用完`};
  }
  return {ok:true, msg:''};
}

function autoCalcLeaveQuota(userId) {
  const user = getUser(userId);
  if (!user?.hireDate) { showToast('⚠️ 請先設定到職日','warn'); return; }
  const annual  = calcAnnualLeaveQuota(user.hireDate);
  const welfare = calcWelfareLeaveQuota(user.hireDate);
  const expiry  = calcNextAnniversary(user.hireDate);

  [[LT_ANNUAL, annual], [LT_WELFARE, welfare]].forEach(([ltId, days]) => {
    let b = getBalance(userId, ltId);
    if (b) { b.totalDays = days; b.expiryDate = expiry; }
    else if (days > 0) state.data.balances.push({userId, leaveTypeId:ltId, totalDays:days, usedDays:0, expiryDate:expiry});
  });

  // Ensure calendar-year types exist with correct yearMax
  state.data.leaveTypes.filter(lt => lt.calcType==='calendar' && lt.yearMax).forEach(lt => {
    if (!getBalance(userId, lt.id))
      state.data.balances.push({userId, leaveTypeId:lt.id, totalDays:lt.yearMax, usedDays:0, expiryDate:`${new Date().getFullYear()}-12-31`});
  });

  saveData();
  showToast(`✅ 已更新：特別假 ${annual}天・福利假 ${welfare}天`);
  renderEmployees();
}

function calcDays(start, end) {
  let d=0;
  for(let x=new Date(start+'T00:00:00');x<=new Date(end+'T00:00:00');x.setDate(x.getDate()+1))
    if(x.getDay()!==0&&x.getDay()!==6) d++;
  return d;
}
function fmtDate(d) { return d ? new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}) : '-'; }
function today() { return new Date().toISOString().split('T')[0]; }

function roleLabel(r) { return {employee:'員工',manager:'主管',hr:'HR',ceo:'CEO'}[r]||r; }
function roleBadge(role) { return `<span class="rbadge rb-${role}">${roleLabel(role)}</span>`; }
function roleDotColor(role) { return {employee:'#16A34A',manager:'#2563EB',hr:'#D97706',ceo:'#7C3AED'}[role]||'#64748B'; }

function payTypeLabel(pt) { return {full:'全薪',half:'半薪',none:'不給薪'}[pt]||''; }
function daysToHours(days) { return Math.round(days * 8 * 10) / 10; }
function hoursToDays(hours) { return Math.round(hours / 8 * 1000) / 1000; }
function generatePassword() {
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let pwd='';
  for(let i=0;i<8;i++) pwd+=chars[Math.floor(Math.random()*chars.length)];
  // Ensure at least 1 letter and 1 digit
  if(!/[A-Za-z]/.test(pwd)||!/[0-9]/.test(pwd)) return generatePassword();
  return pwd;
}
function togglePwd(id) {
  const el=document.getElementById(id);
  if(el) el.type=el.type==='password'?'text':'password';
}

function statusBadge(req) {
  if (req.status==='approved') return '<span class="badge badge-approved">✅ 已核准</span>';
  if (req.status==='rejected') return '<span class="badge badge-rejected">❌ 已退件</span>';
  const uid = (req.approvalChain||[])[req.currentStep||0];
  const ap  = uid ? getUser(uid) : null;
  const step = req.approvalChain?.length > 1 ? ` (${(req.currentStep||0)+1}/${req.approvalChain.length})` : '';
  return `<span class="badge badge-pending">⏳ 待 ${ap?ap.name:'?'} 審核${step}</span>`;
}

function chainStepsHtml(req) {
  const chain = req.approvalChain||[];
  if (!chain.length) return '';
  return '<div class="chain-steps">' + chain.map((uid,i) => {
    const u = getUser(uid);
    let cls='step-wait', icon=i+1;
    if (req.status==='approved'||i<req.currentStep){cls='step-done';icon='✓';}
    else if (i===req.currentStep&&req.status==='pending'){cls='step-current';icon='⏳';}
    return `${i>0?'<span style="color:#CBD5E1;font-size:11px">→</span>':''}
      <div style="display:flex;align-items:center;gap:3px">
        <div class="step-dot ${cls}">${icon}</div>
        <span style="font-size:12px;color:#475569">${u?u.name:'?'}</span>
      </div>`;
  }).join('') + '</div>';
}

//  APPROVAL CHAIN LOGIC
// ═══════════════════════════════════════
function getApprovalChain(userId, days) {
  const user = getUser(userId);
  if (!user || user.orgLevel===1) return [];
  const ceo = state.data.users.find(u=>u.orgLevel===1);
  if (user.orgLevel===2) return ceo?[ceo.id]:[];
  const superior = user.reportTo ? getUser(user.reportTo) : null;
  if (!superior) return ceo?[ceo.id]:[];
  if (days < 3) return [superior.id];
  const chain = [superior.id];
  if (ceo && ceo.id!==superior.id) chain.push(ceo.id);
  return chain;
}

// Chain pills for org chart display
function pillFor(u) {
  if (!u) return `<span class="chain-pill" style="background:#F1F5F9;color:#64748B">?</span>`;
  const cls={employee:'cp-employee',manager:'cp-manager',hr:'cp-hr',ceo:'cp-ceo'}[u.role]||'cp-employee';
  const emoji={employee:'👤',manager:'🔵',hr:'🟡',ceo:'👑'}[u.role]||'👤';
  return `<span class="chain-pill ${cls}">${emoji} ${u.name}</span>`;
}

function buildChainDisplay(u) {
  if (u.role==='hr') return `
    <div class="observer-cell">
      <div class="observer-badge">👁️ 觀察者・記錄人</div>
      <div style="font-size:11px;color:#94A3B8;margin-top:4px">掌握所有審批進度，不在審批鏈中</div>
    </div>`;
  if (u.role==='ceo') return pillFor(u)+`<span style="font-size:12px;color:#94A3B8;margin-left:6px">最終審批人</span>`;
  if (!u.reportTo) return `<span style="color:#DC2626;font-size:13px">⚠️ 尚未指定直屬主管</span>`;

  const short = getApprovalChain(u.id, 1);
  const long  = getApprovalChain(u.id, 3);
  const sameChain = JSON.stringify(short)===JSON.stringify(long);

  const buildRow = (chain) => [pillFor(u), ...chain.map(uid=>getUser(uid)).map(pillFor)]
    .join('<span class="chain-arrow">→</span>');

  if (sameChain) return `<div class="chain-display"><div class="chain-row">${buildRow(short)}</div></div>`;

  return `<div class="chain-display">
    <div class="chain-row"><span class="chain-day-label">1–2 天</span>${buildRow(short)}</div>
    <div class="chain-row"><span class="chain-day-label">3 天↑</span>${buildRow(long)}</div>
  </div>`;
}

function applyUnitChange() {
  const isHours = document.querySelector('input[name="applyUnit"]:checked')?.value==='hours';
  document.getElementById('applyEndGroup').style.display = isHours?'none':'';
  document.getElementById('applyHalfGroup').style.display = isHours?'none':'';
  document.getElementById('applyHoursGroup').style.display = isHours?'':'none';
  document.getElementById('applyStartLabel').textContent = isHours?'請假日期 *':'開始日期 *';
  applyCalc();
}

function applyTypeChange() {
  const u=state.currentUser;
  const ltId=parseInt(document.getElementById('applyType').value);
  const b=getBalance(u.id,ltId);
  const lt=getLeaveType(ltId);
  const el=document.getElementById('applyTypeInfo');

  // Show/hide hourly toggle for 特休
  const unitRow=document.getElementById('applyUnitRow');
  if (unitRow) {
    unitRow.style.display = ltId===LT_ANNUAL?'':'none';
    if (ltId!==LT_ANNUAL) {
      const daysRadio=document.querySelector('input[name="applyUnit"][value="days"]');
      if(daysRadio){daysRadio.checked=true;applyUnitChange();}
    }
  }

  if (!ltId){el.innerHTML='';return;}
  const elig=checkLeaveEligibility(u.id,ltId);
  if (!elig.ok){el.innerHTML=`<div class="alert alert-danger">⛔ ${elig.msg}</div>`;return;}
  const rem=b?b.totalDays-b.usedDays:null;
  const exp=b?.expiryDate&&new Date(b.expiryDate)<new Date();
  let remDisplay='';
  // 顯示臨界點警告（待審核特休將修完）
  const eligWarning = elig.warning ? `<div class="alert alert-warning" style="margin-bottom:8px">⚠️ ${elig.warning}</div>` : '';
  if (ltId===LT_ANNUAL&&rem!==null) remDisplay=`・剩餘 <strong>${daysToHours(rem)} 小時</strong>（已用 ${daysToHours(b.usedDays)} / ${daysToHours(b.totalDays)} 小時）`;
  else if (rem!==null) remDisplay=`・剩餘 <strong>${rem} 天</strong>（已用 ${b.usedDays}/${b.totalDays}）`;
  el.innerHTML=`${eligWarning}<div class="alert ${exp?'alert-danger':'alert-info'}">
    ${lt.emoji} ${lt.name}・${payTypeLabel(lt.payType)}
    ${remDisplay}
    ${b?.expiryDate?`・期限 ${fmtDate(b.expiryDate)}${exp?' ⚠️已過期':''}` : ''}
    ${lt.requiresAnnualFirst&&!elig.warning?'・<span style="color:#7C3AED;font-weight:600">需先用完特別休假</span>':''}
    ${lt.deductible?'・<span style="color:#DC2626;font-weight:600">★此假別將扣薪</span>':''}
  </div>`;
  applyCalc();
}

function applyCalc() {
  const u=state.currentUser;
  const ltId=parseInt(document.getElementById('applyType').value);
  const start=document.getElementById('applyStart').value;
  const dEl=document.getElementById('applyDaysInfo');
  const cEl=document.getElementById('applyChainInfo');
  const isHoursMode=document.querySelector('input[name="applyUnit"]:checked')?.value==='hours';

  if (isHoursMode && ltId===LT_ANNUAL) {
    if (!start){dEl.innerHTML='';cEl.innerHTML='';return;}
    const hours=parseInt(document.getElementById('applyHours')?.value||1);
    const days=hoursToDays(hours);
    const b=getBalance(u.id,ltId);
    const remHours=b?daysToHours(b.totalDays-b.usedDays):999;
    const ok=hours<=remHours;
    dEl.innerHTML=`<div class="alert ${ok?'alert-success':'alert-danger'}">🕐 請假 <strong>${hours} 小時</strong>${!ok?`・<span style="color:#DC2626">⚠️ 超過餘額（剩餘 ${remHours} 小時）</span>`:''}</div>`;
    const chain=getApprovalChain(u.id,days);
    if (chain.length) cEl.innerHTML=`<div class="alert alert-info">🔗 審批流程：${[u.name,...chain.map(id=>getUser(id)?.name||'?')].join(' → ')}</div>`;
    else cEl.innerHTML='';
    return;
  }

  const end=document.getElementById('applyEnd').value;
  const half=document.getElementById('applyHalf').checked;
  if (!start||!end){dEl.innerHTML='';cEl.innerHTML='';return;}
  if (new Date(end)<new Date(start)){dEl.innerHTML='<div class="alert alert-danger">⚠️ 結束日期不能早於開始日期</div>';cEl.innerHTML='';return;}
  const days=half?0.5:calcDays(start,end);
  const b=getBalance(u.id,ltId);
  const rem=b?b.totalDays-b.usedDays:999;
  const ok=days<=rem;
  dEl.innerHTML=`<div class="alert ${ok?'alert-success':'alert-danger'}">📆 請假 <strong>${days} 天</strong>（工作日）${!ok?`・<span style="color:#DC2626">⚠️ 超過餘額（${rem} 天）</span>`:''}</div>`;
  const chain=getApprovalChain(u.id,days);
  if (chain.length) {
    const note=days>=3&&u.orgLevel===3?'（3天以上，逐級送簽）':'';
    cEl.innerHTML=`<div class="alert alert-info">🔗 審批流程：${[u.name,...chain.map(id=>getUser(id)?.name||'?')].join(' → ')} ${note}</div>`;
  } else cEl.innerHTML='';
}

function submitLeave() {
  const u=state.currentUser;
  const ltId=parseInt(document.getElementById('applyType').value);
  const start=document.getElementById('applyStart').value;
  const reason=document.getElementById('applyReason').value.trim();
  if (!ltId){showToast('⚠️ 請選擇假別','warn');return;}
  if (!start){showToast('⚠️ 請填寫日期','warn');return;}
  if (!reason){showToast('⚠️ 請填寫原因','warn');return;}
  const elig=checkLeaveEligibility(u.id,ltId);
  if (!elig.ok){showToast('⛔ '+elig.msg,'err');return;}

  const isHoursMode=document.querySelector('input[name="applyUnit"]:checked')?.value==='hours';
  let days, hours=null, end=start, halfDay=false;

  if (isHoursMode && ltId===LT_ANNUAL) {
    hours=parseInt(document.getElementById('applyHours').value);
    days=hoursToDays(hours);
  } else {
    end=document.getElementById('applyEnd').value;
    halfDay=document.getElementById('applyHalf').checked;
    if (!end){showToast('⚠️ 請填寫結束日期','warn');return;}
    if (new Date(end)<new Date(start)){showToast('⚠️ 日期錯誤','warn');return;}
    days=halfDay?0.5:calcDays(start,end);
  }

  const b=getBalance(u.id,ltId);
  if (b&&days>b.totalDays-b.usedDays){showToast('⚠️ 假別餘額不足','err');return;}
  if (b?.expiryDate&&new Date(b.expiryDate)<new Date()){showToast('⚠️ 此假別已過期','err');return;}
  const chain=getApprovalChain(u.id,days);
  state.data.requests.push({id:state.data.nextId++,userId:u.id,leaveTypeId:ltId,startDate:start,endDate:end,days,hours,halfDay,reason,status:'pending',approvalChain:chain,currentStep:0,approvalLog:[],createdAt:today()});
  saveData();
  showToast('✅ 申請已送出，等待審核');
  navigate('myLeaves');
}

function approvalTable(reqs, showPrevApproval=false) {
  return `<div class="table-wrap"><table>

      const b=getBalance(r.userId,r.leaveTypeId);const rem=b?b.totalDays-b.usedDays:'-';
      const prevLog=(r.approvalLog||[]).find(l=>l.step===r.currentStep-1);
      const prevAp=prevLog?getUser(prevLog.approverId):null;
      return `<tr>
        <td><strong>${emp?.name}</strong><br><span class="text-muted">${emp?.title}</span></td>

let _pAction=null;
function showApproveModal(reqId,action) {
  _pAction={reqId,action};
  document.getElementById('modal-note').value='';
  const btn=document.getElementById('modal-confirm-btn');
  if (action==='approve'){document.getElementById('modal-title').textContent='✅ 核准請假申請';document.getElementById('modal-sub').textContent='核准後將進入下一審批流程或完成';btn.textContent='確認核准';btn.className='btn btn-success';}
  else{document.getElementById('modal-title').textContent='❌ 退件請假申請';document.getElementById('modal-sub').textContent='請填寫退件原因，方便員工重新申請';btn.textContent='確認退件';btn.className='btn btn-danger';}
  // 主管審核警告：核准福利假但員工仍有已核准特休餘額
  const warnEl=document.getElementById('modal-warning');
  if (warnEl) {
    const req=state.data.requests.find(r=>r.id===reqId);
    if (action==='approve' && req && req.leaveTypeId===2) {
      const ab=getBalance(req.userId,LT_ANNUAL);
      const remHours=ab?daysToHours(ab.totalDays-ab.usedDays):0;
      if (remHours>0) {
        warnEl.textContent=`⚠️ 注意：此員工尚有 ${remHours} 小時特休未修完。依規定須先修完特休才可使用福利假，請確認是否核准。`;
        warnEl.style.display='block';
      } else {
        warnEl.style.display='none';
      }
    } else {
      warnEl.style.display='none';
    }
  }
  btn.onclick=processApproval;
  document.getElementById('approveModal').classList.add('show');
}

function processApproval() {
  const {reqId,action}=_pAction;
  const note=document.getElementById('modal-note').value.trim();
  const req=state.data.requests.find(r=>r.id===reqId);
  const u=state.currentUser;
  if (!req) return;
  req.approvalLog=req.approvalLog||[];
  req.approvalLog.push({step:req.currentStep,approverId:u.id,action,note,time:today()});
  if (action==='reject'){req.status='rejected';}
  else {
    req.currentStep=(req.currentStep||0)+1;
    if (req.currentStep>=req.approvalChain.length){
      req.status='approved';
      const b=getBalance(req.userId,req.leaveTypeId);
      if(b) b.usedDays+=req.days;
    }
  }
  saveData();closeModal('approveModal');
  showToast(action==='approve'?(req.status==='approved'?'✅ 全程核准，已扣除額度':'✅ 已核准，轉送下一審批人'):'✅ 已退件');
  state.currentUser.role==='ceo'?renderCeoApprovals():renderApprovals();
}

function getReportData() {
  const year=parseInt(document.getElementById('repYear').value);
  const month=parseInt(document.getElementById('repMonth').value);
  const ym=`${year}-${String(month).padStart(2,'0')}`;
  const emps=state.data.users.filter(u=>u.role!=='ceo');
  const lts=state.data.leaveTypes;
  return emps.map(emp=>{
    const usedByType={};lts.forEach(lt=>{usedByType[lt.id]=0;});
    state.data.requests.filter(r=>r.userId===emp.id&&r.status==='approved'&&(r.startDate.startsWith(ym)||r.endDate.startsWith(ym)))
      .forEach(r=>{usedByType[r.leaveTypeId]=(usedByType[r.leaveTypeId]||0)+r.days;});
    const totalUsed=Object.values(usedByType).reduce((s,v)=>s+v,0);
    const deductDays=lts.filter(lt=>lt.deductible).reduce((s,lt)=>s+(usedByType[lt.id]||0),0);
    return {emp,usedByType,totalUsed,deductDays};
  });
}

function exportCSV() {
  const year=parseInt(document.getElementById('repYear').value);
  const month=parseInt(document.getElementById('repMonth').value);
  const data=getReportData();const lts=state.data.leaveTypes;
  const headers=['員工姓名','部門','職稱',...lts.map(lt=>lt.name),'合計請假天數','應扣薪天數'];
  const rows=data.map(row=>[row.emp.name,row.emp.dept,row.emp.title,...lts.map(lt=>row.usedByType[lt.id]||0),row.totalUsed,row.deductDays]);
  const csv=[headers,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`請假報表_${year}年${month}月.csv`;a.click();

}

function updateEmpField(uid,field,val) {

function updateQuota(uid,ltid,field,val) {
  const b=getBalance(uid,ltid);if(!b)return;

function addBalance(uid,ltid) {
  const lt=getLeaveType(ltid);

function removeBalance(uid,ltid) {
  state.data.balances=state.data.balances.filter(b=>!(b.userId===uid&&b.leaveTypeId===ltid));

function addEmployee() {

  const title=prompt('職稱：')||'員工';

        <div class="form-group full">
          <label>加班原因 <span style="color:#DC2626">*</span></label>

        </div>
      </div>

      </div>
    </div>
  `);

function otCalc() {
  const date=document.getElementById('otDate').value;
  const start=document.getElementById('otStart').value;
  const end=document.getElementById('otEnd').value;
  const el=document.getElementById('otCalcInfo');
  if (!date||!start||!end){el.innerHTML='';return;}
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const mins=(eh*60+em)-(sh*60+sm);
  if (mins<=0){el.innerHTML='<div class="alert alert-danger">⚠️ 結束時間必須晚於開始時間</div>';return;}
  const hrs=(mins/60).toFixed(1);
  el.innerHTML=`<div class="alert alert-success">⏱️ 加班時數：<strong>${hrs} 小時</strong></div>`;
}

function submitOvertime() {
  const u=state.currentUser;
  const date=document.getElementById('otDate').value;
  const start=document.getElementById('otStart').value;
  const end=document.getElementById('otEnd').value;
  const reason=document.getElementById('otReason').value.trim();
  if (!date){showToast('⚠️ 請填寫加班日期','warn');return;}
  if (!start||!end){showToast('⚠️ 請填寫起訖時間','warn');return;}
  if (!reason){showToast('⚠️ 請填寫加班原因','warn');return;}
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const mins=(eh*60+em)-(sh*60+sm);
  if (mins<=0){showToast('⚠️ 結束時間必須晚於開始時間','err');return;}
  const hours=parseFloat((mins/60).toFixed(1));
  if (!state.data.overtimes) state.data.overtimes=[];
  if (!state.data.nextOvertimeId) state.data.nextOvertimeId=1;
  const chain=getApprovalChain(u.id,1);
  state.data.overtimes.push({id:state.data.nextOvertimeId++,userId:u.id,date,startTime:start,endTime:end,hours,reason,status:'pending',approvalChain:chain,currentStep:0,approvalLog:[],createdAt:today()});
  saveData();
  showToast('✅ 加班申請已送出，等待審核');
  navigate('myOvertimes');
}

let _otAction=null;
function showOvertimeApproveModal(otId,action) {
  _otAction={otId,action};
  document.getElementById('ot-modal-note').value='';
  const btn=document.getElementById('ot-modal-confirm-btn');
  if (action==='approve'){
    document.getElementById('ot-modal-title').textContent='✅ 核准加班申請';
    document.getElementById('ot-modal-sub').textContent='確認核准此加班申請？';
    btn.textContent='確認核准';btn.className='btn btn-success';
  } else {
    document.getElementById('ot-modal-title').textContent='❌ 退件加班申請';
    document.getElementById('ot-modal-sub').textContent='請填寫退件原因';
    btn.textContent='確認退件';btn.className='btn btn-danger';
  }
  btn.onclick=processOvertimeApproval;
  document.getElementById('overtimeModal').classList.add('show');
}

function processOvertimeApproval() {
  const {otId,action}=_otAction;
  const note=document.getElementById('ot-modal-note').value.trim();
  const ot=(state.data.overtimes||[]).find(o=>o.id===otId);
  const u=state.currentUser;
  if (!ot) return;
  ot.approvalLog=ot.approvalLog||[];
  ot.approvalLog.push({step:ot.currentStep,approverId:u.id,action,note,time:today()});
  if (action==='reject'){ot.status='rejected';}
  else {
    ot.currentStep=(ot.currentStep||0)+1;
    if (ot.currentStep>=ot.approvalChain.length) ot.status='approved';
  }
  saveData();closeModal('overtimeModal');
  showToast(action==='approve'?(ot.status==='approved'?'✅ 全程核准':'✅ 已核准，轉送下一審批人'):'✅ 已退件');
  u.role==='ceo'?renderCeoOvertimeApprovals():renderOvertimeApprovals();
}

            <td>${roleBadge(emp.role)}</td>
            <td style="font-size:13px">${superior?superior.name:'<span class="text-muted">-</span>'}</td>
            <td style="font-size:13px">${emp.hireDate?fmtDate(emp.hireDate):'<span class="text-muted">-</span>'}</td>
            <td style="font-size:12px;color:#64748B">${emp.hireDate?serviceLabel(emp.hireDate):'-'}</td>
            <td><div class="btn-group">
              <button class="btn btn-sm btn-ghost" onclick="showEmployeeModal(${emp.id})">✏️ 編輯</button>
              <button class="btn btn-sm btn-danger" onclick="removeEmployeeFromAccounts(${emp.id})">🗑️</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
  `);
}

let _editEmpId=null;
function showEmployeeModal(uid) {
  _editEmpId=uid;
  const u=uid?getUser(uid):null;
  document.getElementById('empModal-title').textContent=u?`編輯員工：${u.name}`:'新增員工';
  document.getElementById('empModal-sub').textContent=u?`ID: ${u.id}・${u.email||'無Email'}`:'填寫新員工基本資料';
  document.getElementById('emp-name').value=u?.name||'';
  document.getElementById('emp-email').value=u?.email||'';
  document.getElementById('emp-dept').value=u?.dept||'';
  document.getElementById('emp-title').value=u?.title||'';
  document.getElementById('emp-role').value=u?.role||'employee';
  document.getElementById('emp-hireDate').value=u?.hireDate||'';
  const sel=document.getElementById('emp-reportTo');
  sel.innerHTML='<option value="">— 未指定 —</option>'+
    state.data.users.filter(x=>!uid||x.id!==uid)
      .map(x=>`<option value="${x.id}" ${u?.reportTo===x.id?'selected':''}>${x.name}（${x.title}）</option>`).join('');
  document.getElementById('employeeModal').classList.add('show');
}

function saveEmployeeModal() {
  const name=document.getElementById('emp-name').value.trim();
  if (!name){showToast('⚠️ 請填寫姓名','warn');return;}
  const email=document.getElementById('emp-email').value.trim();
  const dept=document.getElementById('emp-dept').value.trim()||'未分配';
  const title=document.getElementById('emp-title').value.trim()||'員工';
  const role=document.getElementById('emp-role').value;
  const hireDate=document.getElementById('emp-hireDate').value;
  const reportToVal=document.getElementById('emp-reportTo').value;
  const reportTo=reportToVal?parseInt(reportToVal):null;
  const orgLevel=role==='ceo'?1:(role==='manager'||role==='hr')?2:3;

  if (_editEmpId) {
    const u=getUser(_editEmpId);
    if (u){
      u.name=name;u.email=email;u.dept=dept;u.title=title;
      u.role=role;u.hireDate=hireDate;u.reportTo=reportTo;
      if (reportTo){const sup=getUser(reportTo);if(sup)u.orgLevel=Math.min(sup.orgLevel+1,3);}
      else u.orgLevel=orgLevel;
      saveData();closeModal('employeeModal');showToast(`✅ 已更新 ${name}`);renderEmployeeAccounts();
    }
  } else {
    const newId=Math.max(...state.data.users.map(u=>u.id),0)+1;
    state.data.users.push({id:newId,name,email,role,dept,title,orgLevel,reportTo,hireDate});
    state.data.leaveTypes.forEach(lt=>{
      const expiry=lt.calcType==='anniversary'?calcNextAnniversary(hireDate):`${new Date().getFullYear()}-12-31`;
      state.data.balances.push({userId:newId,leaveTypeId:lt.id,totalDays:0,usedDays:0,expiryDate:expiry});
    });
    const sel=document.getElementById('userSelect');
    if(sel) sel.innerHTML+=`<option value="${newId}">${name}（${roleLabel(role)}・${title}）</option>`;
    saveData();closeModal('employeeModal');showToast(`✅ 已新增 ${name}`);renderEmployeeAccounts();
  }
}

// ═══════════════════════════════════════
//  VIEW: CHANGE PASSWORD
// ═══════════════════════════════════════
function renderChangePassword() {
  render(`
    <div class="topbar"><h2>🔐 修改密碼</h2></div>
    <div class="card" style="max-width:480px">
      <div class="card-title">修改登入密碼</div>
      <div class="form-group">
        <label>目前密碼</label>
        <div class="pwd-wrap">
          <input type="password" id="cpOld" placeholder="輸入目前密碼">
          <button class="pwd-toggle" onclick="togglePwd('cpOld')" tabindex="-1">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label>新密碼（8位以上，英數混合）</label>
        <div class="pwd-wrap">
          <input type="password" id="cpNew1" placeholder="輸入新密碼">
          <button class="pwd-toggle" onclick="togglePwd('cpNew1')" tabindex="-1">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label>確認新密碼</label>
        <div class="pwd-wrap">
          <input type="password" id="cpNew2" placeholder="再次輸入新密碼">
          <button class="pwd-toggle" onclick="togglePwd('cpNew2')" tabindex="-1">👁</button>
        </div>
      </div>
      <div id="cpError" style="display:none" class="alert alert-danger"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="navigate('dashboard')">取消</button>
        <button class="btn btn-primary" onclick="submitChangePassword()">確認修改</button>
      </div>
    </div>
  `);
}

function submitChangePassword() {
  const u=state.currentUser;
  const oldPwd=document.getElementById('cpOld').value;
  const pwd1=document.getElementById('cpNew1').value;
  const pwd2=document.getElementById('cpNew2').value;
  const errEl=document.getElementById('cpError');
  if (oldPwd!==u.password){errEl.textContent='目前密碼輸入錯誤';errEl.style.display='block';return;}
  if (pwd1.length<8){errEl.textContent='新密碼至少需要 8 位';errEl.style.display='block';return;}
  if (!/[A-Za-z]/.test(pwd1)||!/[0-9]/.test(pwd1)){errEl.textContent='密碼須同時包含英文字母及數字';errEl.style.display='block';return;}
  if (pwd1!==pwd2){errEl.textContent='兩次輸入的密碼不一致';errEl.style.display='block';return;}
  const userInData=state.data.users.find(x=>x.id===u.id);
  if (userInData){userInData.password=pwd1;state.currentUser.password=pwd1;}
  saveData();
  showToast('✅ 密碼已成功修改');
  navigate('dashboard');
}

function resetEmployeePassword(uid) {
  const u=getUser(uid);
  if (!u) return;
  const newPwd=generatePassword();
  u.password=newPwd;
  u.mustChangePassword=true;
  saveData();
  alert(`${u.name} 的新預設密碼已重設：\n\n  ${newPwd}\n\n請將此密碼通知員工，下次登入時系統將強制要求修改密碼。`);
  showToast(`✅ 已重設 ${u.name} 的密碼`);
  renderEmployeeAccounts();
}

function removeEmployeeFromAccounts(uid) {
  const m=document.getElementById('deleteModal');
  document.getElementById('delete-sub').textContent=`確定要移除員工「${getUser(uid)?.name}」嗎？`;
  document.getElementById('delete-confirm-btn').onclick=()=>{
    state.data.users=state.data.users.filter(u=>u.id!==uid);
    state.data.balances=state.data.balances.filter(b=>b.userId!==uid);
    state.data.requests=state.data.requests.filter(r=>r.userId!==uid);
    if(state.data.overtimes) state.data.overtimes=state.data.overtimes.filter(o=>o.userId!==uid);
    saveData();closeModal('deleteModal');showToast('✅ 已移除');renderEmployeeAccounts();
  };
  m.classList.add('show');
}

// ═══════════════════════════════════════
//  EXCEL EXPORT (SheetJS)
// ═══════════════════════════════════════
function loadSheetJS(cb) {
  if (typeof XLSX !== 'undefined') { cb(); return; }
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=cb;
  s.onerror=()=>showToast('⚠️ 無法載入 Excel 模組，請確認網路連線','err');
  document.head.appendChild(s);
}

function exportMonthlyExcel() {
  loadSheetJS(()=>{
    const year=parseInt(document.getElementById('repYear').value);
    const month=parseInt(document.getElementById('repMonth').value);
    const ym=`${year}-${String(month).padStart(2,'0')}`;
    const emps=state.data.users;
    const lts=state.data.leaveTypes;

    // ── Sheet 1：請假報表 ──
    const leaveHeader=['員工姓名','帳號','部門','職稱',...lts.map(lt=>lt.name),'合計請假天數','應扣薪天數'];
    const leaveRows=emps.map(emp=>{
      const used={};lts.forEach(lt=>{used[lt.id]=0;});
      state.data.requests
        .filter(r=>r.userId===emp.id&&r.status==='approved'&&(r.startDate.startsWith(ym)||r.endDate.startsWith(ym)))
        .forEach(r=>{used[r.leaveTypeId]=(used[r.leaveTypeId]||0)+(r.leaveTypeId===LT_ANNUAL&&r.hours?r.hours/8:r.days);});
      const total=Object.values(used).reduce((s,v)=>s+v,0);
      const deduct=lts.filter(lt=>lt.deductible).reduce((s,lt)=>s+(used[lt.id]||0),0);
      // 特休顯示為小時
      const vals=lts.map(lt=>lt.id===LT_ANNUAL?(used[lt.id]?daysToHours(used[lt.id])+'小時':0):used[lt.id]||0);
      return [emp.name, emp.username||'-', emp.dept, emp.title, ...vals, total||0, deduct||0];
    });

    // 加小計列
    const totalRow=['合計','','',''];
    lts.forEach((_,i)=>{
      const colVals=leaveRows.map(r=>typeof r[4+i]==='string'?parseFloat(r[4+i])||0:r[4+i]);
      totalRow.push(colVals.reduce((s,v)=>s+v,0));
    });
    totalRow.push(leaveRows.reduce((s,r)=>s+r[4+lts.length],0));
    totalRow.push(leaveRows.reduce((s,r)=>s+r[5+lts.length],0));

    const ws1=XLSX.utils.aoa_to_sheet([leaveHeader,...leaveRows,totalRow]);
    // 設定欄寬
    ws1['!cols']=[{wch:14},{wch:14},{wch:10},{wch:12},...lts.map(()=>({wch:10})),{wch:12},{wch:10}];
    // 標頭樣式（SheetJS CE 不支援完整樣式，但設定基本格式）
    ws1['!rows']=[{hpt:20}];

    // ── Sheet 2：加班記錄 ──
    const otHeader=['員工姓名','帳號','部門','加班日期','開始時間','結束時間','時數(小時)','原因','狀態'];
    const statusMap={approved:'已核准',rejected:'已退件',pending:'審核中'};
    const otRows=(state.data.overtimes||[])
      .filter(o=>o.date.startsWith(ym))
      .map(o=>{
        const emp=getUser(o.userId);
        return [emp?.name||'-', emp?.username||'-', emp?.dept||'-', o.date, o.startTime, o.endTime, o.hours, o.reason, statusMap[o.status]||o.status];
      });
    const otSummaryRow=['','','','加班總時數','','',otRows.reduce((s,r)=>s+r[6],0),'',''];
    const ws2=XLSX.utils.aoa_to_sheet([otHeader,...otRows,...(otRows.length?[otSummaryRow]:[])]);
    ws2['!cols']=[{wch:14},{wch:14},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:20},{wch:10}];

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws1,'請假報表');
    XLSX.utils.book_append_sheet(wb,ws2,'加班記錄');
    XLSX.writeFile(wb,`假勤報表_${year}年${month}月.xlsx`);
    showToast(`📥 已匯出 ${year}年${month}月 Excel 報表`);
  });
}
